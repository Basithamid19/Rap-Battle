<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Neo-Brutalist Frame & Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="40" fill="#000000"/>
  <rect x="16" y="16" width="464" height="464" rx="40" fill="#FFE600" stroke="#000000" stroke-width="14"/>

  <!-- Sticker Badge in Corner -->
  <rect x="50" y="50" width="140" height="44" rx="10" fill="#FF5470" stroke="#000000" stroke-width="6"/>
  <text x="120" y="78" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">RAP BATTLE</text>

  <!-- Cyan Lightning Bolt -->
  <polygon points="390,50 440,50 410,110 445,110 375,180 395,125 365,125" fill="#00F0FF" stroke="#000000" stroke-width="6"/>

  <!-- Neo-Brutalist Microphone Center -->
  <g transform="translate(256, 260)">
    <!-- Hard Shadow of Mic -->
    <rect x="-42" y="-12" width="104" height="114" rx="20" fill="#000000"/>
    <path d="M -42 -22 C -42 -95, 62 -95, 62 -22 Z" fill="#000000"/>

    <!-- Mic Mesh Capsule -->
    <path d="M -50 -30 C -50 -105, 50 -105, 50 -30 Z" fill="#FF5470" stroke="#000000" stroke-width="10"/>
    <circle cx="0" cy="-60" r="22" fill="#FFE600" stroke="#000000" stroke-width="6"/>

    <!-- Mic Body -->
    <rect x="-50" y="-20" width="100" height="110" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="10"/>

    <!-- Grille Lines -->
    <line x1="-36" y1="8" x2="36" y2="8" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <line x1="-36" y1="36" x2="36" y2="36" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <line x1="-36" y1="64" x2="36" y2="64" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

    <!-- Mic Stand -->
    <rect x="-14" y="90" width="28" height="60" fill="#000000"/>
    <rect x="-60" y="145" width="120" height="24" rx="12" fill="#00E599" stroke="#000000" stroke-width="8"/>

    <!-- Sound Sparks -->
    <line x1="-90" y1="-30" x2="-65" y2="-30" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <line x1="-85" y1="-70" x2="-60" y2="-55" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="-30" x2="65" y2="-30" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <line x1="85" y1="-70" x2="60" y2="-55" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
